# Integración continua: construye las dos imágenes de la app en cada Pull Request.
# El pipeline no compila por su cuenta: usa los Dockerfiles del TP2, que son la
# misma definición de build que después se despliega.
name: CI

on:
  pull_request:
    branches: [main]      # el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # deja la corrida que lee el badge y el cache para todos

jobs:
  build-backend:
    runs-on: ubuntu-latest

    # Mínimo privilegio: sólo este job publica, así que sólo este job puede escribir
    # paquetes. Declararlo a nivel del workflow REEMPLAZA el default para todos los jobs
    # y le daría permiso de escritura a jobs que no publican nada.
    #
    # Lo que no se lista queda sin permiso: por eso `contents: read` no es de más — sin él
    # el checkout no puede leer el código.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4
        with:
          # Docker Hub limita las descargas anónimas por IP, y los runners de GitHub
          # comparten IP entre miles de proyectos: cada tanto la cuota ya está agotada
          # cuando llega nuestra corrida y el build muere con 429 antes de empezar.
          #
          # Esto redirige las descargas de Docker Hub a un espejo público. Va acá y no en
          # los Dockerfiles a propósito: el problema es de este entorno, no de la
          # definición de la imagen, que tiene que seguir funcionando igual en cualquier
          # máquina. El contenido es el mismo — un espejo sirve las mismas capas.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # ── Tests y cobertura ────────────────────────────────────────────────
      # Cada build tiene su propio scope de cache. Ahora el repo construye cuatro cosas
      # distintas (las dos imágenes y las dos etapas de tests), así que son cuatro
      # estantes: sin eso se pisan y los CACHED aparecen y desaparecen sin patrón.
      - name: Construir la etapa de tests
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test        # se detiene en la etapa de tests, no llega a la imagen final
          load: true          # la baja al Docker local; sin esto el docker run no la encuentra
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      # El -v es el puente: lo que el contenedor escribe en /out aparece en el disco del
      # runner. Sin él los tests corren, salen verdes, y sus resultados se van con el
      # contenedor — el que falla después es el paso del reporte, con un mensaje que no
      # dice que falta esto.
      - name: Correr los tests con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci \
            --collect:"XPlat Code Coverage"

      # Corre en el runner y no en el contenedor: los archivos ya están afuera gracias al -v.
      # Los class filters recortan el reporte al mismo código que se exige en el umbral:
      # el arranque, las entidades, los DTOs y las migraciones no son lógica que testear.
      - name: Reporte de coverage
        if: ${{ !cancelled() }}   # también cuando los tests fallaron: es cuando se quiere mirar
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/*/coverage.cobertura.xml" \
            -sourcedirs:backend \
            -targetdir:coveragereport \
            "-reporttypes:Html;MarkdownSummaryGithub" \
            "-classfilters:-Program*;-JoyeriaStock.Api.Domain.Entities.*;-JoyeriaStock.Api.Application.Dtos.*;-JoyeriaStock.Api.Infrastructure.Migrations.*;-JoyeriaStock.Api.Infrastructure.Configurations.*;-JoyeriaStock.Api.Infrastructure.AppDbContext;-JoyeriaStock.Api.Infrastructure.DbSeeder*"
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage y resultados del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: |
            coveragereport
            TestResults/tests.trx

      # ── El artefacto: lo que el pipeline ENTREGA cuando terminó de verificar ──
      #
      # Estos dos pasos van ÚLTIMOS, y ahí está toda la gracia: no hay ningún `if` que
      # diga "si los tests pasaron". No hace falta. Los steps corren en orden y se cortan
      # al primer error, así que si el `docker run` de los tests devolvió rojo, el job
      # murió antes y acá no se llega nunca. La condición no está escrita: está en el orden.
      #
      # Por eso tampoco llevan `!cancelled()` como los del reporte: ése se puso justamente
      # para que corriera con los tests en rojo, y acá sería lo contrario de lo que se busca.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No hace falta ningún secret nuevo: GitHub le da a cada corrida un token propio
          # que vive lo que dura el job. La credencial se le pasa al comando que la
          # necesita y no queda guardada en ningún lado.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          # Dos condiciones, no una. Con sólo el evento alcanzaría hoy, porque el workflow
          # escucha main y los PR. Pero el día que se agregue otra rama al disparador, un
          # push a esa rama publicaría algo que nunca pasó por un PR ni por los guardianes.
          # La garantía conviene tenerla acá y no en el `on:` del archivo.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # En minúsculas y a mano: el registry no acepta mayúsculas, y
          # ${{ github.repository }} devolvería "MatiasAmuchastegui/ingsoft3-tp01".
          #
          # La etiqueta es el COMMIT que produjo la imagen. Es lo que permite contestar
          # "¿lo que está corriendo es lo que se verificó?" comparándola con el código.
          tags: ghcr.io/matiasamuchastegui/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4
        with:
          # Docker Hub limita las descargas anónimas por IP, y los runners de GitHub
          # comparten IP entre miles de proyectos: cada tanto la cuota ya está agotada
          # cuando llega nuestra corrida y el build muere con 429 antes de empezar.
          #
          # Esto redirige las descargas de Docker Hub a un espejo público. Va acá y no en
          # los Dockerfiles a propósito: el problema es de este entorno, no de la
          # definición de la imagen, que tiene que seguir funcionando igual en cualquier
          # máquina. El contenido es el mismo — un espejo sirve las mismas capas.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # ── Tests y cobertura ────────────────────────────────────────────────
      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      # COVERAGE_DIR le dice al script dónde escribir, y /salida está montado sobre
      # frontend-coverage/ del runner: por eso el reporte aparece afuera. Si se cambia una
      # de las tres rutas hay que cambiar las tres.
      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      # Dos frenos, y hacen falta los dos. El `test -f` cubre que el archivo no exista.
      # El `if (!t.lines.total)` cubre el caso silencioso: si el include no matchea nada,
      # el archivo SÍ se escribe, con total 0 y pct "Unknown" — y con cero archivos medidos
      # el umbral ni se evalúa. Sin este segundo freno, el job quedaría verde.
      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # ── El artefacto ─────────────────────────────────────────────────────
      # Últimos pasos del job, igual que en el backend: si los tests fallaron, acá no
      # se llega. El orden ES la condición.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/matiasamuchastegui/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ══════════════════════════════════════════════════════════════════════════
  # Entrega continua: lo verificado se despliega, primero a QA y después a producción
  # ══════════════════════════════════════════════════════════════════════════
  #
  # Hasta acá el pipeline verificaba y publicaba imágenes. De acá para abajo las pone a
  # correr. La cadena entera es: Pull Request → merge a main → QA automático →
  # aprobación humana → producción. Ningún paso se puede saltear, porque cada uno
  # depende del anterior con `needs:`.

  deploy-qa:
    # Las dos imágenes tienen que estar publicadas. Si cualquiera de los dos jobs falló
    # —tests en rojo, build roto— este job ni se encola.
    needs: [build-backend, build-frontend]

    # Sólo desde main. Un Pull Request verifica, no despliega: todavía no es código que
    # el proyecto aceptó.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # El `environment` hace tres cosas: le da al job acceso a los secrets de ESE entorno
    # (los hooks de QA no son los de producción), deja el historial de despliegues en la
    # pestaña Environments del repo, y publica el link de abajo en la corrida.
    environment:
      name: qa
      url: https://joyeria-front-qa.onrender.com

    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Qué se va a desplegar
        run: echo "Commit $GITHUB_SHA · imágenes sha-$GITHUB_SHA"

      # El hook es una URL secreta: un POST ahí dispara un deploy de ese servicio.
      #
      # El `&ref=` es lo que convierte esto en entrega continua de verdad. Sin él, Render
      # despliega la punta de main, que para cuando el hook llega puede tener commits que
      # este pipeline nunca verificó. Con él, despliega EXACTAMENTE el commit que acaba de
      # pasar por los tests.
      #
      # El secret va por `env:` y no interpolado en el `run:`: así el valor no aparece en
      # el comando que GitHub imprime en el log.
      - name: Desplegar el backend en QA
        env:
          HOOK: ${{ secrets.RENDER_HOOK_API }}
        run: curl -fsS -X POST "$HOOK&ref=$GITHUB_SHA" > /dev/null

      - name: Desplegar el frontend en QA
        env:
          HOOK: ${{ secrets.RENDER_HOOK_FRONT }}
        run: curl -fsS -X POST "$HOOK&ref=$GITHUB_SHA" > /dev/null

      # Si esto falla, el job queda rojo y deploy-prod no corre. Es el filtro que impide
      # que un QA roto llegue a producción.
      - name: Prueba de humo en QA
        run: |
          .github/scripts/smoke.sh \
            https://joyeria-front-qa.onrender.com \
            https://ingsoft3-tp01-jx17.onrender.com

      - name: Dejar constancia
        run: |
          {
            echo "### QA desplegado"
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| front | https://joyeria-front-qa.onrender.com |"
            echo "| api | https://ingsoft3-tp01-jx17.onrender.com |"
          } >> $GITHUB_STEP_SUMMARY

  deploy-prod:
    # QA primero, siempre. Nada llega a producción sin haber estado arriba y verde en un
    # entorno equivalente.
    needs: deploy-qa

    runs-on: ubuntu-latest

    # Este entorno tiene un revisor obligatorio configurado en el repo. El job arranca y
    # se queda esperando: GitHub no corre ni el primer step hasta que alguien aprueba.
    #
    # Ahí está la diferencia entre entrega continua y despliegue continuo. El pipeline
    # DEJA TODO LISTO para desplegar en producción con cada cambio verificado; apretar el
    # botón es una decisión de negocio, no técnica. Sacando el revisor, esto mismo pasa a
    # ser despliegue continuo sin tocar una línea del workflow.
    environment:
      name: production
      url: https://joyeria-front-prod.onrender.com

    # Dos merges seguidos a main largan dos despliegues. Sin esto se pisan, y producción
    # puede quedar con la versión más vieja de las dos. Encolados, el orden se respeta.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Qué se va a desplegar
        run: echo "Promoviendo a producción el commit $GITHUB_SHA, ya verificado en QA"

      - name: Desplegar el backend en producción
        env:
          HOOK: ${{ secrets.RENDER_HOOK_API }}
        run: curl -fsS -X POST "$HOOK&ref=$GITHUB_SHA" > /dev/null

      - name: Desplegar el frontend en producción
        env:
          HOOK: ${{ secrets.RENDER_HOOK_FRONT }}
        run: curl -fsS -X POST "$HOOK&ref=$GITHUB_SHA" > /dev/null

      # Mismo script y mismas pruebas que en QA, con otras URLs. Que sea el mismo archivo
      # no es ahorro de tipeo: es la garantía de que producción se valida con el mismo
      # criterio con el que se validó QA.
      - name: Prueba de humo en producción
        run: |
          .github/scripts/smoke.sh \
            https://joyeria-front-prod.onrender.com \
            https://ingsoft3-tp01-1.onrender.com

      - name: Dejar constancia
        run: |
          {
            echo "### Producción desplegada"
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| front | https://joyeria-front-prod.onrender.com |"
            echo "| api | https://ingsoft3-tp01-1.onrender.com |"
          } >> $GITHUB_STEP_SUMMARY
