# Configuración de nginx para servir la SPA y hacer de puerta de entrada al backend.
#
# Decisión central: nginx es el ÚNICO servicio publicado al host. El navegador habla
# sólo con él, y todo lo que empieza con /api lo reenvía al backend por la red interna
# de Docker. Consecuencias:
#
#   - El frontend no necesita CORS: para el navegador es el mismo origen.
#   - La imagen del frontend no lleva ninguna URL adentro, así que la misma imagen
#     sirve en cualquier entorno (release inmutable, TP6/TP7).
#   - El backend y la base no quedan expuestos al host.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx en las respuestas de error.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite le pone un hash al nombre de cada asset (index-ByeSMMTX.js), así que el
    # contenido de una URL nunca cambia: se puede cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html es la excepción: es el que apunta a los assets nuevos después de un
    # deploy. Si se cacheara, el navegador seguiría pidiendo los assets viejos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Todo /api va al backend. La barra final en ambos lados es importante:
    # /api/stock  ->  http://backend:8080/api/stock
    #
    # "backend" es el nombre del servicio en el docker-compose. Docker resuelve ese
    # nombre por DNS dentro de la red del proyecto: no hay IPs escritas en ningún lado.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Estado del backend, accesible desde el host para diagnóstico.
    location = /health {
        proxy_pass http://backend:8080/health;
        access_log off;
    }

    # Estado de nginx mismo, para su propio healthcheck en el compose.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # React Router maneja las rutas en el cliente: /stock y /catalogo no existen como
    # archivos. Sin este try_files, recargar la página en /stock daría un 404 de nginx.
    # Va al final porque "location /" es el menos específico.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
