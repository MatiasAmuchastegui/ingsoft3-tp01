# Solo la base de datos, para no instalar PostgreSQL en Windows.
# El compose completo (backend + frontend + base) es trabajo del TP2.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down          (conserva los datos)
#   docker compose -f docker-compose.dev.yml down -v       (borra los datos)

services:
  db:
    image: postgres:16-alpine
    container_name: joyeria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: joyeria
      POSTGRES_USER: joyeria
      POSTGRES_PASSWORD: joyeria_dev
    ports:
      - "5432:5432"
    volumes:
      - joyeria-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joyeria -d joyeria"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  joyeria-db-data:
